[project]
name = "sapgui-mcp"
version = "0.0.1"
description = "Cost-routed MCP server for SAP: RFC/OData -> WebGUI -> recorded script -> computer-use, cheapest tier first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "adam0thman" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sapgui-mcp = "sapgui_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sapgui_mcp"]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real SAP system via a non-prod creds id (opt-in, deselected by default)",
]
addopts = "-m 'not integration' --cov=sapgui_mcp --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
